apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
spec:
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
    spec:
      containers:
      - name: ledger
        image: oluwasayo91/dotnet-demo-ledger-app
        ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: ledger-service
spec:
  type: ClusterIP
  selector:
    app: ledger
  ports:
  - port: 80
    targetPort: 8080


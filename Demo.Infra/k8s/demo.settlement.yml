apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement
spec:
  selector:
    matchLabels:
      app: settlement
  template:
    metadata:
      labels:
        app: settlement
    spec:
      containers:
      - name: settlement
        image: oluwasayo91/dotnet-demo-settlement-worker
        ports:
        - containerPort: 8080

